name: Test Gate (all feature branches)

on:
  push:
    branches:
      # Every prefix the repository actually uses. `impl*/**` covers the
      # numbered implementation branches as a family -- listing them one at a
      # time is how `impl6/` and `fix/` came to be missing while this workflow
      # still called itself "all feature branches".
      - 'impl*/**'
      - 'fix/**'
      - 'docs/**'
      - 'planning/**'
      - 'chore/**'
      - 'codex/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:gate
      - run: npm run test:database
      - run: npm run verify:android

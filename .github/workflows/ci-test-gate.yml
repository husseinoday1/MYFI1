name: Test Gate (all feature branches)

on:
  push:
    branches:
      - 'impl/**'
      - 'impl2/**'
      - 'docs/**'
      - 'planning/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:gate
      - run: npm run test:database
      - run: npm run verify:android

name: P20-G01-D1 Restore Epoch Gate Diagnostic APK

# P20-G01-D1 — rebuild of the P20-G01 acceptance APK with read-only diagnostics
# added to the gate's BLOCKED payload. Same signing keystore and same acceptance
# flag as the accepted P20-G01 build, so it installs over the existing app.
# It changes no financial behaviour: the only production-source delta versus the
# accepted P20-G01 commit is src/dev/p19RestoreEpochDeviceGate.js.

on:
  workflow_dispatch:
  push:
    branches:
      - impl/p20-g01-acceptance-apk-2026-08-19

permissions:
  contents: read

jobs:
  build-p20-g01-d1-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify accepted P20-G01 baseline and source scope
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTED_GATE="fd98f80dd1eb2f7aca9ad23d5d06aa64940e8ba0"
          # The allowed set lives in .github/p20-g01-d1-allowed-source.txt so it is
          # reviewed like code and edited in one obvious place. Anything appearing in
          # shipped source that is not listed there fails the build, and vice versa.
          # The pathspec is what keeps docs and tests out of the comparison.
          bash .github/scripts/verify-source-scope.sh \
            "$ACCEPTED_GATE" \
            ".github/p20-g01-d1-allowed-source.txt" \
            App.js src android app.json eas.json package.json package-lock.json
          echo "SOURCE_BASE=$ACCEPTED_GATE" >> "$GITHUB_ENV"
          echo "[PASS] accepted P20-G01 baseline and diagnostic-only source scope verified"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load acceptance environment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('eas.json','utf8'));
          const env=cfg?.build?.preview?.env||{};
          for(const key of ['EXPO_PUBLIC_SUPABASE_URL','EXPO_PUBLIC_SUPABASE_KEY']){
            const value=String(env[key]||'').trim();
            if(!value) throw new Error(`[FAIL] Missing ${key} in eas.json preview env`);
            fs.appendFileSync(process.env.GITHUB_ENV,`${key}=${value}\n`);
          }
          NODE
          echo "EXPO_PUBLIC_P19_RESTORE_EPOCH_DEVICE_GATE=1" >> "$GITHUB_ENV"
          # Phase 10 benchmark row. Independent of the gate flag — the two features
          # do not interact, so one diagnostic build can carry both.
          echo "EXPO_PUBLIC_PHASE10_RESTORE_BENCHMARK=1" >> "$GITHUB_ENV"
          echo "[PASS] disposable restore-epoch acceptance flag enabled"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: P20-G01 targeted contract
        run: node tests/p20-g01-phase9-restore-epoch-gate.test.cjs .

      - name: P20 client-closure regression
        run: node tests/p20-v2-client-closure.test.cjs .

      - name: P19 final regression
        run: node tests/p19-final-clean-v2-hardening.test.cjs .

      - name: Static quality gate
        run: npm run test:gate:static

      - name: Runtime quality gate
        run: npm run test:gate:runtime

      - name: Android bundle verification
        run: npm run verify:android

      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C"
          ACTUAL="$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | sed -n 's/.*SHA256: //p' | tr -d ':[:space:]')"
          test "$ACTUAL" = "$EXPECTED"
          echo "[PASS] signing certificate matches installed MYFI"

      - name: Build signed diagnostic APK
        working-directory: android
        env:
          CI: "true"
          EXPO_PUBLIC_P19_RESTORE_EPOCH_DEVICE_GATE: "1"
          EXPO_PUBLIC_PHASE10_RESTORE_BENCHMARK: "1"
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleRelease -x lint -x test --stacktrace --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify diagnostic APK evidence
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          {
            echo "Patch=P20-G01-D1"
            echo "Gate=PHASE9_RESTORE_EPOCH_DEVICE_ACCEPTANCE"
            echo "Purpose=BLOCKED_PAYLOAD_DIAGNOSTICS_ONLY"
            echo "SourceBase=$SOURCE_BASE"
            echo "BuildCommit=$(git rev-parse HEAD)"
            echo "Branch=$(git branch --show-current)"
            echo "APK=$APK"
            echo "SHA256=$SHA"
            echo "SizeBytes=$SIZE"
            echo "ExpoSDK=54"
            echo "ReactNative=0.81.5"
            echo "SQLiteSchemaVersion=8"
            echo "FinancialDataChangedByCode=NO"
            echo "SQLiteSchemaChanged=NO"
            echo "MigrationRequired=NO"
            echo "SecureStoreChanged=NO"
            echo "SupabaseSchemaChanged=NO"
            echo "GatePreconditionsChanged=NO"
            echo "AcceptanceFlag=EXPO_PUBLIC_P19_RESTORE_EPOCH_DEVICE_GATE=1"
            echo "BenchmarkFlag=EXPO_PUBLIC_PHASE10_RESTORE_BENCHMARK=1"
            echo "ProductionFeatureChange=NO"
            echo "DeviceAcceptance=PENDING"
          } | tee P20-G01-D1-build-evidence.txt
          sha256sum "$APK" | tee app-release.apk.sha256

      - name: Upload P20-G01-D1 diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: P20-G01-D1-restore-epoch-diagnostic-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            P20-G01-D1-build-evidence.txt
          if-no-files-found: error
          retention-days: 7

name: P19 FINAL V2 Setup Shell APK

on:
  push:
    branches:
      - r05-p19-final-v2-setup-shell
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-final-v2-setup-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout final setup-shell branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source base and patch scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE="729810b167598cea617573db899bffc2883a10a3"
          bash .github/scripts/verify-source-scope.sh \
            "$EXPECTED_BASE" \
            ".github/p19-final-v2-setup-shell-allowed-source.txt"
          grep -q "financial_v2_adoption_pending_activation" src/store/slices/useSyncSlice.js
          grep -q "P19_FINAL_TRANSIENT_RETRY" src/store/slices/useSyncSlice.js
          grep -q "financial_v2_adoption_setup_shell_not_safe" src/lib/financialLedgerV7Repository.js
          grep -q "P19_FINAL_V2_ACTIVE" src/store/slices/useSyncSlice.js
          grep -q "P19_FINAL_V2_SYNC_OK" src/store/slices/useSyncSlice.js
          echo "[PASS] exact R5 patch scope verified"
          echo "SOURCE_HEAD=$EXPECTED_BASE" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load public Supabase build environment
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('eas.json','utf8'));
          const env=cfg?.build?.preview?.env||{};
          for(const key of ['EXPO_PUBLIC_SUPABASE_URL','EXPO_PUBLIC_SUPABASE_KEY']){
            const value=String(env[key]||'').trim();
            if(!value) throw new Error(`[FAIL] Missing ${key} in eas.json preview env`);
            fs.appendFileSync(process.env.GITHUB_ENV,`${key}=${value}\n`);
          }
          console.log('[PASS] public Supabase build environment loaded');
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Final setup-shell targeted contract
        run: node tests/p19-final-clean-v2-hardening.test.cjs .

      - name: Static quality gate
        run: npm run test:gate:static

      - name: Runtime quality gate
        run: npm run test:gate:runtime

      - name: Android bundle verification
        run: npm run verify:android

      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C"
          ACTUAL="$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | sed -n 's/.*SHA256: //p' | tr -d ':[:space:]')"
          test "$ACTUAL" = "$EXPECTED"
          echo "[PASS] signing certificate matches installed MYFI"

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          CI: "true"
        run: ./gradlew app:assembleRelease -x lint -x test --stacktrace --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          {
            echo "Patch=P19-FINAL-R5"
            echo "SourceCommit=$SOURCE_HEAD"
            echo "BuildCommit=$(git rev-parse HEAD)"
            echo "Branch=$(git branch --show-current)"
            echo "APK=$APK"
            echo "SHA256=$SHA"
            echo "SizeBytes=$SIZE"
            echo "FinancialDataChangedByCode=NO"
            echo "SQLiteSchemaChanged=NO"
            echo "SQLiteSchemaVersion=8"
            echo "MigrationRequired=NO"
            echo "SecureStoreChanged=NO"
            echo "SetupShellAdoption=ZERO_BALANCE_WALLET_ACCOUNT_CATEGORY_WORKSPACE_ONLY"
            echo "V1FallbackAfterCleanAdoption=FORBIDDEN"
            echo "TransientCloudRetry=BOUNDED_BACKOFF"
          } | tee P19-FINAL-R5-apk-evidence.txt
          sha256sum "$APK" | tee app-release.apk.sha256

      - name: Upload final R5 APK
        uses: actions/upload-artifact@v4
        with:
          name: P19-FINAL-v2-setup-shell-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            P19-FINAL-R5-apk-evidence.txt
          if-no-files-found: error
          retention-days: 7

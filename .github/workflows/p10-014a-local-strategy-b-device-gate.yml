name: P10-014A Original Package Clone Probe APK

on:
  workflow_dispatch:
  push:
    branches:
      - impl/p10-014a-local-strategy-b-device-gate-2026-08-22

permissions:
  contents: read

jobs:
  build-p10-014a-r5-clone-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact P10-014A branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify green source base and exact R5 source scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="c39bf6126dc262fc0b53e497a9a0729c9757d20a"
          bash .github/scripts/verify-source-scope.sh \
            "$BASE" \
            ".github/p10-014a-allowed-source.txt" \
            App.js src android app.json eas.json package.json package-lock.json
          echo "SOURCE_BASE=$BASE" >> "$GITHUB_ENV"
          test "$(git diff "$BASE"...HEAD -- App.js src/store src/lib/supabase.js android app.json eas.json package.json package-lock.json | wc -l)" -eq 0
          CHANGED_LIBS="$(git diff --name-only "$BASE"...HEAD -- src/lib | sort)"
          EXPECTED_LIBS=$'src/lib/financialRestorePromotionV13.js\nsrc/lib/ledgerDatabase.js'
          test "$CHANGED_LIBS" = "$EXPECTED_LIBS"
          echo "[PASS] only reviewed P10-014A diagnostic files changed under src/lib"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load bundle environment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('eas.json','utf8'));
          const env=cfg?.build?.preview?.env||{};
          for(const key of ['EXPO_PUBLIC_SUPABASE_URL','EXPO_PUBLIC_SUPABASE_KEY']){
            const value=String(env[key]||'').trim();
            if(!value) throw new Error(`[FAIL] Missing ${key} in eas.json preview env`);
            fs.appendFileSync(process.env.GITHUB_ENV,`${key}=${value}\n`);
          }
          NODE
          echo "EXPO_PUBLIC_P19_RESTORE_EPOCH_DEVICE_GATE=0" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_PHASE10_RESTORE_BENCHMARK=1" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_P10_014A_LOCAL_STRATEGY_B=1" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_P10_014A_CLONE_PROBE=1" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_FRESH_TEST=0" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: R5 clone-probe contract
        run: node tests/phase10-restore-benchmark-memory.test.cjs .

      - name: Full quality gate
        run: npm run test:gate

      - name: Select same-package clone probe entry in CI workspace only
        shell: bash
        run: |
          set -euo pipefail
          cp package.json package.json.r5-backup
          cp android/app/src/main/res/values/strings.xml strings.xml.r5-backup
          node <<'NODE'
          const fs=require('fs');
          const pkgPath='package.json';
          const pkg=JSON.parse(fs.readFileSync(pkgPath,'utf8'));
          if(pkg.main!=='index.js') throw new Error(`[FAIL] unexpected main: ${pkg.main}`);
          pkg.main='src/dev/p10_014aCloneProbeEntry.js';
          fs.writeFileSync(pkgPath,JSON.stringify(pkg,null,2)+'\n');

          const gradle=fs.readFileSync('android/app/build.gradle','utf8');
          if((gradle.split("applicationId 'com.myfi.app'").length-1)!==1) {
            throw new Error('[FAIL] original applicationId contract missing');
          }
          if(gradle.includes("applicationId 'com.myfi.app.p10a'")) {
            throw new Error('[FAIL] isolated diagnostic applicationId is forbidden in R5');
          }

          const stringsPath='android/app/src/main/res/values/strings.xml';
          let strings=fs.readFileSync(stringsPath,'utf8');
          const re=/<string name="app_name">[^<]*<\/string>/;
          if(!re.test(strings)) throw new Error('[FAIL] app_name missing');
          strings=strings.replace(re,'<string name="app_name">MYFI P10 Clone Probe</string>');
          fs.writeFileSync(stringsPath,strings);
          NODE
          test "$(node -p "require('./package.json').main")" = "src/dev/p10_014aCloneProbeEntry.js"
          grep -Fq "applicationId 'com.myfi.app'" android/app/build.gradle
          ! grep -Fq "applicationId 'com.myfi.app.p10a'" android/app/build.gradle
          echo "[PASS] same-package clone probe selected without applicationId change"

      - name: Verify Android diagnostic bundle
        env:
          EXPO_PUBLIC_P19_RESTORE_EPOCH_DEVICE_GATE: "0"
          EXPO_PUBLIC_PHASE10_RESTORE_BENCHMARK: "1"
          EXPO_PUBLIC_P10_014A_LOCAL_STRATEGY_B: "1"
          EXPO_PUBLIC_P10_014A_CLONE_PROBE: "1"
          EXPO_PUBLIC_FRESH_TEST: "0"
        run: npm run verify:android

      - name: Verify signing certificate source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C"
          ACTUAL="$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | sed -n 's/.*SHA256: //p' | tr -d ':[:space:]')"
          test "$ACTUAL" = "$EXPECTED"
          echo "[PASS] build signing certificate source verified"

      - name: Build same-package R5 clone probe APK
        working-directory: android
        env:
          CI: "true"
          EXPO_PUBLIC_P19_RESTORE_EPOCH_DEVICE_GATE: "0"
          EXPO_PUBLIC_PHASE10_RESTORE_BENCHMARK: "1"
          EXPO_PUBLIC_P10_014A_LOCAL_STRATEGY_B: "1"
          EXPO_PUBLIC_P10_014A_CLONE_PROBE: "1"
          EXPO_PUBLIC_FRESH_TEST: "0"
        run: |
          chmod +x ./gradlew
          ./gradlew clean app:assembleRelease -x lint -x test --stacktrace --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Restore CI-only entry changes
        shell: bash
        run: |
          set -euo pipefail
          mv package.json.r5-backup package.json
          mv strings.xml.r5-backup android/app/src/main/res/values/strings.xml
          test "$(node -p "require('./package.json').main")" = "index.js"
          git diff --exit-code -- package.json android/app/src/main/res/values/strings.xml

      - name: Verify APK identity and write evidence
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "package: name='com.myfi.app'"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test -n "$VERSION_CODE"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          {
            echo "Patch=P10-014A-001-R5.2"
            echo "Gate=ORIGINAL_PACKAGE_SQLITE_BACKUP_CLONE"
            echo "AcceptanceComplete=NO"
            echo "NextRequiredSubgate=P10-014A-002_FAULT_AND_RESOURCE_MATRIX"
            echo "CloudHandshakeAcceptance=NOT_TESTED"
            echo "ServerProofSource=synthetic_dev_only"
            echo "SyntheticProofIsCloudEvidence=NO"
            echo "GateSupabaseRpcCalled=NO"
            echo "ProductionRestoreWiring=NO"
            echo "P10_012_MigrationAppliedByGate=NO"
            echo "SourceBase=$SOURCE_BASE"
            echo "BuildCommit=$(git rev-parse HEAD)"
            echo "Branch=$(git branch --show-current)"
            echo "DiagnosticEntry=src/dev/p10_014aCloneProbeEntry.js"
            echo "ApplicationId=com.myfi.app"
            echo "VersionCode=$VERSION_CODE"
            echo "VersionName=$VERSION_NAME"
            echo "OriginalDatabaseMode=PREVERIFIED_FILE_URI_THEN_QUERY_ONLY_LOGICAL_IMMUTABILITY_SOURCE"
            echo "HarnessDatabase=DISPOSABLE_SQLITE_BACKUP_CLONE"
            echo "OriginalDatabaseMutationByHarness=NO"
            echo "CloneCreatedWith=expo-sqlite.backupDatabaseAsync"
            echo "SourcePathVerification=FILE_URI_PLUS_DATABASE_PATH"
            echo "SourceImmutabilityVerification=QUERY_ONLY_TOTAL_CHANGES_DATA_VERSION_SCHEMA_PAGE_INVARIANTS"
            echo "WALCloseFileMetadata=OBSERVATIONAL_NOT_MUTATION_GATE"
            echo "CloneSchemaVerification=LOGICAL_APP_SCHEMA_AND_PAGE_INVARIANTS_DEST_SCHEMA_COOKIE_EXCLUDED"
            echo "CloneDeletedAfterRun=REQUIRED"
            echo "OriginalInstalledApkMustBeBackedUpByDeviceRunner=YES"
            echo "OriginalInstalledApkVersionAndCertMustMatchProbe=YES"
            echo "UninstallAllowed=NO"
            echo "PmClearAllowed=NO"
            echo "DowngradeInstallAllowed=NO"
            echo "MemoryEvidence=EXTERNAL_ADB_REQUIRED"
            echo "SHA256=$SHA"
            echo "SizeBytes=$SIZE"
            echo "SQLiteSchemaChangeToOriginal=NO"
            echo "MigrationOnOriginal=NO"
            echo "SecureStoreChanged=NO"
            echo "SupabaseSchemaChanged=NO"
            echo "DeviceAcceptance=PENDING"
          } | tee P10-014A-R5-build-evidence.txt
          sha256sum "$APK" > app-release.apk.sha256

      - name: Upload R5 clone-probe APK
        uses: actions/upload-artifact@v4
        with:
          name: P10-014A-original-package-clone-probe-R5-2
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            P10-014A-R5-build-evidence.txt
          if-no-files-found: error
          retention-days: 7
